name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: kxyznew/codequality/action@v1
        with:
          fail-on: warning
          upload-sarif: true
